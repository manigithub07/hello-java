apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-java
  template:
    metadata:
      labels:
        app: hello-java
    spec:
      containers:
        - name: hello-java
          image: shubhambari/hello-java:1.0
          imagePullPolicy: Always
          command: ["sh", "-c", "java HelloWorld && sleep 3600"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello-java
spec:
  type: NodePort
  selector:
    app: hello-java
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
